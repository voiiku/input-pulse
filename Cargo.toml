[package]
name = "input-pulse"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Periodically send input to matching windows or GNU screen sessions"
readme = "README.md"
repository = "https://github.com/voiiku/input-pulse"
include = [
    "/src/**",
    "/examples/**",
    "/tests/**",
    "/Cargo.toml",
    "/README.md",
    "/LICENSE",
]
keywords = ["automation", "input", "window", "screen"]
categories = ["command-line-utilities", "os"]

[features]
default = ["cli"]
cli = ["dep:chrono"]

[[bin]]
name = "input-pulse"
required-features = ["cli"]

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = [
    "clock",
    "std",
], optional = true }

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3.9", features = [
    "minwindef",
    "winuser",
    "windef",
    "winbase",
    "errhandlingapi",
] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13.2", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = { version = "0.25.0", features = ["elcapitan"] }
libc = "0.2.183"
